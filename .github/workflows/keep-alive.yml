name: Ping Render server

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check server health
        run: >-
          curl --fail --silent --show-error
          --connect-timeout 15 --max-time 90
          --retry 2 --retry-delay 5 --retry-max-time 180
          https://brighton-prayer-wall.onrender.com/health
